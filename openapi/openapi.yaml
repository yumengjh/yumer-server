info:
  title: 知识库 API
  description: 个人知识库系统 API 文档
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    UpdateRateLimitConfigDto:
      type: object
      properties:
        enabled:
          type: boolean
          description: 是否启用全局限流
          example: true
        ttlMs:
          type: number
          description: 限流时间窗口（毫秒，1000~86400000）
          example: 60000
        limit:
          type: number
          description: 时间窗口内允许的最大请求数（1~100000）
          example: 100
    RegisterDto:
      type: object
      properties:
        username:
          type: string
          description: 用户名
          example: john_doe
        email:
          type: string
          description: 邮箱
          example: john@example.com
        password:
          type: string
          description: 密码
          example: SecurePass123!
        displayName:
          type: string
          description: 显示名称
          example: John Doe
      required:
        - username
        - email
        - password
    LoginDto:
      type: object
      properties:
        emailOrUsername:
          type: string
          description: 邮箱或用户名
          example: john@example.com
        password:
          type: string
          description: 密码
          example: SecurePass123!
      required:
        - emailOrUsername
        - password
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
          description: 刷新令牌
      required:
        - refreshToken
    UpdateMeDto:
      type: object
      properties:
        displayName:
          type: object
          description: 显示名称
          example: John Doe
        avatar:
          type: object
          description: 头像地址
          example: https://example.com/avatar.jpg
        bio:
          type: object
          description: 个人简介
          example: 这是我的简介
    CreateWorkspaceDto:
      type: object
      properties:
        name:
          type: string
          description: 工作空间名称
          example: 我的工作空间
        description:
          type: string
          description: 工作空间描述
          example: 这是一个工作空间描述
        icon:
          type: string
          description: 工作空间图标（emoji）
          example: 📚
      required:
        - name
    UpdateWorkspaceDto:
      type: object
      properties:
        name:
          type: string
          description: 工作空间名称
          example: 更新的工作空间名称
        description:
          type: string
          description: 工作空间描述
          example: 更新的工作空间描述
        icon:
          type: string
          description: 工作空间图标（emoji）
          example: 🚀
        status:
          type: string
          description: 工作空间状态
          example: active
          enum:
            - active
            - archived
    InviteMemberDto:
